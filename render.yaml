services:
  - type: web
    name: 1fi-assignment
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:deploy && npm run db:seed && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: 1fi-assignment-db
          property: connectionString
databases:
  - name: 1fi-assignment-db
    plan: free
    databaseName: onefi
    user: onefi
