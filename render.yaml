services:
  - type: web
    name: 1fi-assignment
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    preDeployCommand: node scripts/prepare-db.js --required
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: 1fi-db
          property: connectionString

databases:
  - name: 1fi-db
    plan: free
    databaseName: fidb
    user: fiuser
