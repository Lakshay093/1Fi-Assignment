services:
  - type: web
    name: 1fi-assignment
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npx tsx prisma/seed.ts && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: 1fi-db
          property: internalConnectionString

databases:
  - name: 1fi-db
    plan: free
    databaseName: fidb
    user: fiuser
